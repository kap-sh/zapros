name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linters
        run: scripts/lint

      - name: Run tests
        run: scripts/test

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.0.3
        with:
          mode: simulation
          run: uv run pytest tests/ --codspeed

  pyodide:
    # The test suite inside Pyodide (Python on WebAssembly, run by Node); see
    # scripts/test-pyodide. The host Python must match Pyodide's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
          python-version: "3.14"

      - name: Cache the Pyodide cross-build environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyodide-build
          key: pyodide-xbuildenv-${{ hashFiles('scripts/test-pyodide') }}

      - name: Run tests in Pyodide
        run: ./scripts/test-pyodide -rs
